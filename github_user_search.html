<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github User Finder</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: #0d1117;
        color: #f0f6fc;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .mainpage {
        width: 90%;
        max-width: 550px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 18px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
    }

    .mainpage h1 {
        font-size: 36px;
        margin-bottom: 10px;
        color: #58a6ff;
    }

    .mainpage > h2 {
        font-size: 18px;
        font-weight: normal;
        color: #8b949e;
        margin-bottom: 30px;
    }

    .searchdiv {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
    }

    #username {
        flex: 1;
        padding: 14px 16px;
        font-size: 16px;
        color: #f0f6fc;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 8px;
        outline: none;
        transition: 0.2s;
    }

    #username:focus {
        border-color: #58a6ff;
        box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
    }

    #username::placeholder {
        color: #6e7681;
    }

    #btn {
        padding: 14px 22px;
        border: none;
        border-radius: 8px;
        background: #238636;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    #btn:hover {
        background: #2ea043;
        transform: translateY(-1px);
    }

    #result {
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 14px;
        padding: 30px 25px;
        min-height: 100px;
        transition: 0.3s;
    }

    #result h2 {
        color: #f0f6fc;
        font-size: 25px;
        margin: 15px 0;
    }

    #result p {
        color: #c9d1d9;
        margin: 9px 0;
        font-size: 16px;
    }

    #result img {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 50%;
        border: 3px solid #30363d;
        margin: 10px 0 20px;
    }

    #result a {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 18px;
        background: #21262d;
        border: 1px solid #30363d;
        border-radius: 7px;
        color: #58a6ff;
        text-decoration: none;
        font-weight: bold;
        transition: 0.2s;
    }

    #result a:hover {
        background: #30363d;
        border-color: #58a6ff;
    }

    @media (max-width: 500px) {
        .mainpage {
            width: 100%;
            padding: 25px;
        }

        .searchdiv {
            flex-direction: column;
        }

        #btn {
            width: 100%;
        }

        .mainpage h1 {
            font-size: 28px;
        }

        #result {
            padding: 25px 15px;
        }
    }
</style>

<body>

    <div class="mainpage">

        <h1>GitHub Search</h1>

        <h2>
            Get User Info Easily
        </h2>

        <div class="searchdiv">
            <input
                id="username"
                type="text"
                placeholder="Enter GitHub username"
            >

            <button id="btn">Search</button>
        </div>

        <div id="result">
            <p>Search for a GitHub user to see their profile.</p>
        </div>

    </div>

</body>
<script>
    const input = document.querySelector('#btn')
    const username = document.querySelector('#username')
    const result = document.querySelector('#result')

    async function getData(entry) {
        const response = await fetch(`
        https://api.github.com/users/${entry}
        `)
    const data = await response.json()

    result.innerHTML = `
    <img src="${data.avatar_url}" alt="${data.login}'s profile picture">

    <h2>${data.name || data.login}</h2>

    <p>@${data.login}</p>

    <p>${data.bio || "No bio available"}</p>

    <p>Followers: ${data.followers}</p>
    <p>Following: ${data.following}</p>
    <p>Repositories: ${data.public_repos}</p>

    <a href="${data.html_url}" target="_blank">
            View GitHub Profile
    </a>
    `
}

    // getData()
    input.addEventListener('click',function(e){
        const entry = username.value
        // console.log(entry);
        
        if(entry == ''){
            result.innerHTML = "Error : Enter Username"
        }
        else{
        getData(entry)


        }
    })
</script>
</html>
